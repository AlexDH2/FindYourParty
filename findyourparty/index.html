<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/FYP.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Metadatos para el Enlace (SEO básico) -->
    <meta name="description" content="Descubre los mejores eventos, compra entradas y reserva mesas VIP en Find Your Party. ¡No te quedes fuera! 🥂" />
    <meta name="theme-color" content="#c026d3" />

    <!-- Open Graph (Para cuando pegas el link en WhatsApp, Facebook, Instagram) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="🔥 FYP | Encuentra tu próxima gran fiesta 🎉" />
    <meta property="og:description" content="¿Dónde es el after? Compra tus entradas, asegura tu mesa VIP y vive la mejor noche. Haz clic para ver la cartelera. 🪩" />
    <meta property="og:image" content="https://find-your-party-git-main-findyourparty.vercel.app/FYP_banner_default.png" />
    
    <!-- Twitter Cards (Para compartir en Twitter/X o Discord) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="🔥 FYP | Find Your Party" />
    <meta name="twitter:description" content="Compra tus entradas y asegura tu lugar antes de que se agoten. 🎟️" />
    <meta name="twitter:image" content="https://find-your-party-git-main-findyourparty.vercel.app/FYP_banner_default.png" />
    <title>🔥 FYP | Find Your Party 🎉</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      let previousTitle = document.title;
      window.addEventListener('blur', () => {
        previousTitle = document.title;
        document.title = '👀 ¡Vuelve a la fiesta! 🥂';
      });
      window.addEventListener('focus', () => {
        document.title = previousTitle;
      });
    </script>
  </body>
</html>
